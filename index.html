<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>از کجا شروع کنم؟</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
padding:20px;
color:#fff;
background:
radial-gradient(circle at 15% 20%,#8b5cf655,transparent 30%),
radial-gradient(circle at 85% 80%,#06b6d455,transparent 30%),
linear-gradient(135deg,#050816,#15113b,#041c27);
overflow-x:hidden;
}

.container{
width:min(760px,100%);
margin:auto;
padding-top:45px;
}

.hero{
text-align:center;
animation:fadeDown .8s ease;
}

.badge{
display:inline-block;
padding:9px 18px;
border-radius:30px;
background:#ffffff12;
border:1px solid #ffffff25;
box-shadow:0 0 25px #8b5cf655;
margin-bottom:20px;
}

h1{
font-size:50px;
margin-bottom:14px;
text-shadow:0 0 35px #8b5cf688;
}

.subtitle{
color:#d5d8e5;
line-height:1.9;
font-size:17px;
}

.card{
margin-top:30px;
padding:27px;
border-radius:28px;
background:#ffffff0d;
border:1px solid #ffffff20;
backdrop-filter:blur(20px);
box-shadow:0 25px 80px #0009;
animation:fadeUp .8s ease;
}

input{
width:100%;
padding:18px;
border-radius:17px;
border:1px solid #ffffff22;
outline:none;
background:#ffffff0c;
color:white;
font-size:16px;
margin-bottom:14px;
transition:.3s;
}

input::placeholder{
color:#aeb4c4;
}

input:focus{
border-color:#8b5cf6;
box-shadow:0 0 25px #8b5cf655;
transform:translateY(-2px);
}

button{
width:100%;
padding:17px;
border:0;
border-radius:17px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
background:linear-gradient(135deg,#8b5cf6,#06b6d4);
box-shadow:0 12px 35px #06b6d444;
transition:.25s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 18px 45px #06b6d666;
}#result{
display:none;
}

#title{
font-size:25px;
margin-bottom:20px;
}

.progressTop{
display:flex;
justify-content:space-between;
color:#d7d9e4;
margin-bottom:9px;
}

.progress{
height:13px;
background:#ffffff12;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

#progressBar{
height:100%;
width:0%;
border-radius:20px;
background:linear-gradient(90deg,#8b5cf6,#06b6d4);
box-shadow:0 0 18px #06b6d4;
transition:width .5s ease;
}

.step{
padding:17px;
margin:12px 0;
border-radius:18px;
background:#ffffff0b;
border:1px solid #ffffff18;
cursor:pointer;
transition:.3s;
animation:stepIn .5s ease both;
}

.step:hover{
transform:translateX(-6px);
background:#ffffff16;
box-shadow:0 8px 25px #0005;
}

.step.done{
text-decoration:line-through;
opacity:.5;
}

.step.done::before{
content:"✓ ";
color:#22c55e;
font-weight:bold;
}

@keyframes fadeDown{
from{
opacity:0;
transform:translateY(-30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes stepIn{
from{
opacity:0;
transform:translateX(25px);
}
to{
opacity:1;
transform:translateX(0);
}
}#finish{
display:none;
text-align:center;
margin-top:20px;
padding:22px;
border-radius:20px;
background:#22c55e18;
border:1px solid #22c55e44;
box-shadow:0 0 30px #22c55e22;
animation:pop .5s ease;
}

.newGoal{
margin-top:14px;
background:#ffffff12;
box-shadow:none;
}

.confetti{
position:fixed;
top:-20px;
width:9px;
height:9px;
border-radius:2px;
pointer-events:none;
z-index:99;
animation:fall 2.2s linear forwards;
}

@keyframes pop{
0%{
opacity:0;
transform:scale(.8);
}
70%{
transform:scale(1.06);
}
100%{
opacity:1;
transform:scale(1);
}
}

@keyframes fall{
from{
transform:translateY(0) rotate(0);
opacity:1;
}
to{
transform:translateY(105vh) rotate(720deg);
opacity:0;
}
}

@media(max-width:600px){

body{
padding:12px;
}

.container{
padding-top:25px;
}

h1{
font-size:34px;
}

.subtitle{
font-size:15px;
}

.card{
padding:18px;
border-radius:22px;
}

}</style>
</head>

<body>

<div class="container">

<div class="hero">

<div class="badge">
🚀 از کجا شروع کنم؟
</div>

<h1>
از کجا شروع کنم؟
</h1>

<p class="subtitle">
هدفت رو بنویس تا قدم‌به‌قدم مسیر شروع رو برات بسازم.
</p>

</div>

<div class="card">

<input
id="goal"
type="text"
placeholder="مثلاً: یادگیری فتوشاپ"
>

<button onclick="start()">
✨ شروع کنیم
</button>

</div>

<div class="card" id="result">

<h2 id="title">
مسیر شروع
</h2>

<div class="progressTop">
<span>پیشرفت</span>
<span id="progressText">0 از 0</span>
</div>

<div class="progress">
<div id="progressBar"></div>
</div>

<div id="steps">

<div class="step"></div>
<div class="step"></div>
<div class="step"></div>
<div class="step"></div>
<div class="step"></div>
<div class="step"></div>

</div>

<div id="finish">
🎉 عالیه! همه‌ی قدم‌ها رو انجام دادی!
</div>

<button class="newGoal" onclick="newGoal()">
🔄 هدف جدید
</button>

</div>

</div><script>

let currentSteps = [];

const goalSteps = {

"برنامه نویسی":[
"انتخاب زبان برنامه‌نویسی",
"یادگیری مفاهیم پایه",
"نصب ابزارهای لازم",
"نوشتن اولین برنامه",
"تمرین با پروژه‌های کوچک",
"ساخت یک پروژه واقعی"
],

"انگلیسی":[
"مشخص کردن سطح فعلی",
"یادگیری کلمات پرکاربرد",
"تمرین جمله‌سازی",
"تمرین شنیداری",
"تمرین مکالمه",
"مرور روزانه"
],

"فتوشاپ":[
"آشنایی با محیط فتوشاپ",
"یادگیری ابزارهای اصلی",
"یادگیری لایه‌ها",
"تمرین ابزارهای انتخاب",
"اصلاح رنگ و نور",
"ساخت یک پروژه ساده"
],

"امتحان":[
"مشخص کردن مباحث امتحان",
"تقسیم مطالب به بخش‌های کوچک",
"مطالعه روزانه",
"حل نمونه سؤال",
"مرور مطالب",
"مرور نهایی"
],"ورزش":[
"مشخص کردن هدف",
"انتخاب فعالیت مناسب",
"شروع با تمرین سبک",
"یادگیری حرکت‌های درست",
"تمرین منظم",
"بررسی پیشرفت"
],

"مهارت":[
"مشخص کردن مهارت موردنظر",
"پیدا کردن منابع مناسب",
"یادگیری یک بخش کوچک",
"تمرین عملی",
"ساخت یک پروژه کوچک",
"تمرین منظم"
]

};

function findGoal(goal){

let text = goal.toLowerCase();

for(let key in goalSteps){

if(text.includes(key)){
return goalSteps[key];
}

}

return[
"هدفت رو دقیق مشخص کن",
"اطلاعات اولیه رو پیدا کن",
"کار رو به بخش‌های کوچک تقسیم کن",
"اولین قدم رو شروع کن",
"به‌صورت منظم ادامه بده",
"پیشرفتت رو بررسی کن"
];

}function start(){

let goal = document.getElementById("goal").value.trim();

if(!goal){
alert("اول هدفت رو بنویس 😊");
return;
}

currentSteps = findGoal(goal);

document.getElementById("title").innerText =
"مسیر شروع برای: " + goal;

let steps = document.querySelectorAll(".step");

steps.forEach(function(step,index){

step.innerText = currentSteps[index];

step.classList.remove("done");

step.onclick = function(){

step.classList.toggle("done");

updateProgress();

};

});

document.getElementById("result").style.display = "block";

document.getElementById("finish").style.display = "none";

updateProgress();

document.getElementById("result").scrollIntoView({
behavior:"smooth"
});

}function updateProgress(){

let done = document.querySelectorAll(".step.done").length;
let total = currentSteps.length;

let percent = (done / total) * 100;

document.getElementById("progressBar").style.width =
percent + "%";

document.getElementById("progressText").innerText =
done + " از " + total;

if(done === total){

document.getElementById("finish").style.display = "block";

celebrate();

}else{

document.getElementById("finish").style.display = "none";

}

}

function celebrate(){

for(let i = 0; i < 25; i++){

let piece = document.createElement("div");

piece.className = "confetti";

piece.style.left = Math.random() * 100 + "vw";

piece.style.background =
"hsl(" + Math.random() * 360 + ",80%,60%)";

piece.style.animationDelay =
Math.random() * .5 + "s";

document.body.appendChild(piece);

setTimeout(function(){
piece.remove();
},2500);

}

}function newGoal(){

document.getElementById("goal").value = "";

document.getElementById("result").style.display = "none";

window.scrollTo({
top: 0,
behavior: "smooth"
});

}

document.getElementById("goal")
.addEventListener("keydown", function(event){

if(event.key === "Enter"){
start();
}

});

</script>

</body>
</html>
